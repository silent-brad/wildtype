plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'bio'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_26
    targetCompatibility = JavaVersion.VERSION_26
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ['--enable-preview']
}

tasks.withType(JavaExec) {
    jvmArgs += ['--enable-preview', '--enable-native-access=ALL-UNNAMED']
}

repositories {
    mavenCentral()
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Database
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.xerial:sqlite-jdbc:3.46.0.0'

    // Computer Vision
    implementation 'org.openpnp:opencv:4.9.0-0'

    // ONNX Runtime — platform classifier added conditionally if needed
    implementation 'com.microsoft.onnxruntime:onnxruntime:1.18.0'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

application {
    mainClass = 'org.wildtype.App'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs = ['--enable-preview', '--enable-native-access=ALL-UNNAMED']
}

// Optional: JVM args for JEP 489 Vector API (stretch goal)
spotless {
    java {
        palantirJavaFormat('2.97.0')
        formatAnnotations()
    }
}

tasks.named('bootRun') {
    jvmArgs = ['--enable-preview', '--enable-native-access=ALL-UNNAMED', '--add-modules', 'jdk.incubator.vector']
}
