<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${sighting.species()} + ' — Wildtype'">
      Bird — Wildtype
    </title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css" />
  </head>
  <body>
    <h1 th:text="${sighting.species()}">Bird</h1>

    <img
      class="detail-image"
      th:src="${sighting.imagePath()}"
      alt="sighting"
      onerror="this.style.display='none'"
    />

    <div class="meta">
      <span
        class="confidence"
        th:text="${#numbers.formatDecimal(sighting.confidence() * 100, 0, 0)} + '%'"
        >91%</span
      >
      &mdash;
      <span th:text="${sighting.detectedAt()}">2026-08-07T14:23:01Z</span>
      &mdash;
      <span th:text="'ID: ' + ${sighting.id()}">ID: 1</span>
    </div>

    <a class="back-link" th:href="@{/}">← Back to dashboard</a>
  </body>
</html>
