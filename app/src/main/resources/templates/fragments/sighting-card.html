<div th:fragment="card(s)" class="card" th:id="'sighting-' + ${s.id()}">
  <a th:href="'/sightings/' + ${s.id()}">
    <img
      th:src="${s.imagePath()}"
      alt="sighting"
      onerror="this.style.display='none'"
    />
  </a>
  <div class="card-body">
    <a th:href="'/sightings/' + ${s.id()}">
      <div class="species" th:text="${s.species()}">Bird</div>
    </a>
    <div class="meta">
      <span
        class="confidence"
        th:text="${#numbers.formatDecimal(s.confidence() * 100, 0, 0)} + '%'"
        >91%</span
      >
      &mdash;
      <span th:text="${s.detectedAt()}">2026-08-07T14:23:01Z</span>
    </div>
  </div>
</div>
