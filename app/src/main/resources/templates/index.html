<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Wildtype Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css" />
  </head>
  <body>
    <h1>Wildtype Dashboard</h1>
    <p>Live sightings from your backyard.</p>

    <div id="counts">
      <span
        th:each="entry : ${counts}"
        class="badge"
        th:text="${entry.key} + ': ' + ${entry.value}"
        >Bird: 3</span
      >
    </div>

    <div id="sightings">
      <p th:if="${sightings.isEmpty()}" class="empty">
        No sightings yet. Motion will trigger detection.
      </p>
      <div
        th:each="s : ${sightings}"
        class="card"
        th:id="'sighting-' + ${s.id()}"
      >
        <a th:href="'/sightings/' + ${s.id()}">
          <img
            th:src="${s.imagePath()}"
            alt="sighting"
            onerror="this.style.display='none'"
          />
        </a>
        <div class="card-body">
          <a th:href="'/sightings/' + ${s.id()}">
            <div class="species" th:text="${s.species()}">Bird</div>
          </a>
          <div class="meta">
            <span
              class="confidence"
              th:text="${#numbers.formatDecimal(s.confidence() * 100, 0, 0)} + '%'"
              >91%</span
            >
            &mdash;
            <span th:text="${s.detectedAt()}">2026-08-07T14:23:01Z</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      const es = new EventSource("/api/sightings/stream");
      es.onmessage = (e) => {
        const container = document.getElementById("sightings");
        const empty = container.querySelector(".empty");
        if (empty) empty.remove();
        container.insertAdjacentHTML("afterbegin", e.data);
      };
      es.onerror = () => {
        console.log("SSE error, reconnecting...");
      };
    </script>
  </body>
</html>
