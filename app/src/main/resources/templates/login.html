<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Wildtype — Sign In</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css" />
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css" />
  </head>
  <body>
    <div class="login-box">
      <h1>Wildtype</h1>
      <form method="post" action="/login">
        <input type="hidden" name="username" value="wildtype" />
        <div th:if="${param.error}" class="error">Invalid password.</div>
        <p>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
            autofocus
          />
        </p>
        <button type="submit">Sign In</button>
      </form>
    </div>
  </body>
</html>
